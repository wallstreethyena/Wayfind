<!doctype html>
<html>
<head><title>Synthetic guest form</title></head>
<body>
  <h1>Guest details</h1>
  <form>
    <label>First name <input data-synthetic="first-name" name="first"></label>
    <label>Last name <input data-synthetic="last-name" name="last"></label>
    <label>Phone <input data-synthetic="phone" name="phone"></label>
    <label>Email <input data-synthetic="email" name="email"></label>
    <button data-synthetic="submit" type="button" id="go">Complete reservation</button>
  </form>
  <script>
    document.getElementById("go").addEventListener("click", function () {
      document.body.innerHTML = "<h1>Reservation confirmed</h1><p>Confirmation number OTSYN1001</p><p>Restaurant Synthetic Grill</p><p>Date 2026-11-20</p><p>Time 19:00</p><p>Party 4</p>";
    });
  </script>
</body>
</html>
