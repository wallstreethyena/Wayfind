# .github/workflows/guards.yml — MERGE PROTECTION, ENFORCED (2026-08-07).
#
# Owner: "how can we make sure going forward that each time we are merging we
# are checking to make sure things are done correctly?"
#
# Until now the 290-guard prebuild suite ran on whichever machine prepared the
# PR — protection by convention. This workflow makes it protection by
# MACHINE: every pull request and every push to main runs the full guard
# suite AND a production build on GitHub's own runners. A red suite blocks
# the merge (once "Require status checks" is enabled for `guards` in
# Settings → Branches → main); nobody's local green has to be trusted again,
# including the lanes' and the owner's own.
#
# The suite is the SAME `npm run prebuild` every lane already runs — no new
# rules, just nowhere left to skip them.
# SHARDED 2026-11-13. One 15 min job made every merge stale every other green PR.
# The SAME suite now runs as four GUARD_SHARD jobs (scripts/lib/guardShards.mjs;
# test-guard-shards.mjs proves the shards cover scripts/guards.txt exactly once)
# next to the rendered/audit and build jobs. The final job is still named
# "guards" and fails unless every part succeeded, so branch protection is
# unchanged and nothing is skipped. Vercel still runs the full unsharded suite:
# its buildCommand is `npm run build`, whose prebuild is `node scripts/run-guards.mjs`
# with GUARD_SHARD unset.
# SHARD MULTIPLICITY 2026-11-14. "Every shard succeeded" is not "every guard ran":
# each shard now reports executed_<i>/digest_<i>/shards_<i> through GITHUB_OUTPUT
# (scripts/run-guards.mjs; guards cannot write it), and the "guards" job re-derives
# the partition from the same checkout (run-guards --verify-shards) and fails unless
# every shard 1..4 ran exactly its assigned guards and the counts sum to
# scripts/guards.txt. A missing, cancelled, skipped or duplicated shard is red.
# Install must not touch a tracked file, so an install hook cannot swap the verifier.
name: guards
on:
  # Recovery path when the normal pull_request event cannot produce a runnable
  # check (for example a bot-written head commit or a previously blocked run).
  # This executes the same sharded jobs below; it is not a bypass.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
# A newer push to the same PR branch cancels the stale run, but every commit on
# main keeps its own run: back-to-back merges must each be proven, not only the
# last one (verifier finding 2026-11-14).
concurrency:
  group: guards-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true
# Read-only token for guards that read the pull request.
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  shard:
    name: guards-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One output name per shard: a matrix job's legs merge their outputs and an
    # empty value never overwrites another leg's.
    outputs:
      executed_1: ${{ steps.run.outputs.executed_1 }}
      executed_2: ${{ steps.run.outputs.executed_2 }}
      executed_3: ${{ steps.run.outputs.executed_3 }}
      executed_4: ${{ steps.run.outputs.executed_4 }}
      digest_1: ${{ steps.run.outputs.digest_1 }}
      digest_2: ${{ steps.run.outputs.digest_2 }}
      digest_3: ${{ steps.run.outputs.digest_3 }}
      digest_4: ${{ steps.run.outputs.digest_4 }}
      shards_1: ${{ steps.run.outputs.shards_1 }}
      shards_2: ${{ steps.run.outputs.shards_2 }}
      shards_3: ${{ steps.run.outputs.shards_3 }}
      shards_4: ${{ steps.run.outputs.shards_4 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: several guards diff against origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      # An install hook must not rewrite the verifier (or any tracked file).
      - name: Install left every tracked file untouched
        run: git diff --exit-code --stat HEAD --
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Rendered guards inside the suite measure real cards; keep the browser
      # available in every shard exactly as the single job had it.
      - name: Install Chromium for rendered guards
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            if node -e "require('playwright').chromium.launch().then((b) => b.close()).catch((e) => { console.error(e.message); process.exit(1); })"; then
              echo "cached Chromium launches: system dependencies already present, apt skipped"
            else
              npx playwright install-deps chromium
            fi
          else
            npx playwright install --with-deps chromium
          fi
      - name: Guard suite shard ${{ matrix.shard }}/4 (scripts/guards.txt)
        id: run
        env:
          GUARD_SHARD: ${{ matrix.shard }}/4
          # Read-only (see permissions above).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -z "${NODE_OPTIONS:-}"
          node scripts/run-guards.mjs

  rendered:
    name: guards-rendered-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      # Build tooling also executes in trusted CI. Audit the whole lockfile,
      # not only production dependencies, before running the application checks.
      # GHSA-fc5q-39xc-vjpf (picomatch ReDoS) has no patched release: npm 4.0.7
      # is still inside the vulnerable range, and `npm audit fix --force` would
      # downgrade @sentry/nextjs. scripts/audit-allowlist.mjs ignores that one
      # advisory id. Every other moderate, high, or critical advisory still
      # fails this step. Remove the exception when picomatch ships a fix.
      - name: Dependency security audit
        run: |
          set -o pipefail
          audit_rc=0
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || audit_rc=$?
          if [ "$audit_rc" -gt 1 ]; then
            echo "npm audit failed before a report was produced (exit $audit_rc)"
            exit "$audit_rc"
          fi
          node scripts/audit-allowlist.mjs "$RUNNER_TEMP/npm-audit.json"
      - name: Cache Playwright Chromium
        if: always()
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # 2026-11-05: on a cache hit launch the cached browser first; apt only when it cannot start.
      - name: Install Chromium for rendered guards
        if: always()
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            if node -e "require('playwright').chromium.launch().then((b) => b.close()).catch((e) => { console.error(e.message); process.exit(1); })"; then
              echo "cached Chromium launches: system dependencies already present, apt skipped"
            else
              npx playwright install-deps chromium
            fi
          else
            npx playwright install --with-deps chromium
          fi
      - name: Required rendered place-card standard
        if: always()
        run: node scripts/check-place-card-standard.mjs --require-browser
      - name: Upload place-card geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: place-card-standard-${{ github.sha }}
          path: artifacts/place-card-standard/
          if-no-files-found: error
          retention-days: 14
      - name: Required rendered map pin standard
        if: always()
        run: node scripts/test-map-pin-standard.mjs --require-browser

  build:
    name: guards-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Production build
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npx next build
      # postbuild (check-bundle) only runs on `npm run build`. #949 shipped green
      # here and died on Vercel; the ratchet must run after the build.
      - name: Homepage bundle ratchet
        run: node scripts/check-bundle.mjs

  # The ONE check branch protection requires. Green only when every shard, the
  # rendered/audit job and the build succeeded AND the shards' reports prove every
  # guard of the manifest ran exactly once; a skipped or cancelled part is red.
  guards:
    name: guards
    if: always()
    needs: [shard, rendered, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the merge gate succeeded
        env:
          SHARD: ${{ needs.shard.result }}
          RENDERED: ${{ needs.rendered.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "shards=$SHARD rendered=$RENDERED build=$BUILD"
          test "$SHARD" = "success" && test "$RENDERED" = "success" && test "$BUILD" = "success"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every guard of the manifest ran exactly once across the shards
        env:
          GUARD_SHARD_COUNT: "4"
          GUARD_SHARD_REPORT: ${{ toJSON(needs.shard.outputs) }}
        run: node scripts/run-guards.mjs --verify-shards
