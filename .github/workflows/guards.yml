# .github/workflows/guards.yml — MERGE PROTECTION, ENFORCED (2026-08-07).
#
# Owner: "how can we make sure going forward that each time we are merging we
# are checking to make sure things are done correctly?"
#
# Until now the 290-guard prebuild suite ran on whichever machine prepared the
# PR — protection by convention. This workflow makes it protection by
# MACHINE: every pull request and every push to main runs the full guard
# suite AND a production build on GitHub's own runners. A red suite blocks
# the merge (once "Require status checks" is enabled for `guards` in
# Settings → Branches → main); nobody's local green has to be trusted again,
# including the lanes' and the owner's own.
#
# The suite is the SAME `npm run prebuild` every lane already runs — no new
# rules, just nowhere left to skip them.
# SHARDED 2026-11-13 (Wayfind engineering OS). One 15 min job made every merge
# stale every other green PR. The SAME suite now runs as four GUARD_SHARD jobs
# (scripts/lib/guardShards.mjs; test-guard-shards.mjs proves the shards cover
# scripts/guards.txt exactly once) next to the rendered/audit and build jobs. The
# final job is still named "guards" and fails unless every part succeeded, so
# branch protection is unchanged and nothing is skipped.
name: guards
on:
  # The merge queue (.github/workflows/merge-queue.yml) re-runs this on a branch
  # it just brought up to date: GITHUB_TOKEN pushes fire no pull_request event.
  # "pr" tells check-doc-ownership which pull request the run belongs to.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number this run proves (merge queue)"
        required: false
        default: ""
  pull_request:
  push:
    branches: [main]
concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true
# Read-only token. check-doc-ownership reads the pull request and its comments to
# verify owner approval (see docs/OWNER_APPROVAL.md).
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  shard:
    name: guards-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-09-09: depth 1 made origin/main unreadable for check-doc-ownership.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Rendered guards inside the suite measure real cards; keep the browser
      # available in every shard exactly as the single job had it.
      - name: Install Chromium for rendered guards
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            if node -e "require('playwright').chromium.launch().then((b) => b.close()).catch((e) => { console.error(e.message); process.exit(1); })"; then
              echo "cached Chromium launches: system dependencies already present, apt skipped"
            else
              npx playwright install-deps chromium
            fi
          else
            npx playwright install --with-deps chromium
          fi
      - name: Guard suite shard ${{ matrix.shard }}/4 (scripts/guards.txt)
        env:
          GUARD_SHARD: ${{ matrix.shard }}/4
          # Evidence for check-doc-ownership's owner approval; read-only (see permissions above).
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-guards.mjs

  rendered:
    name: guards-rendered-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      # Build tooling also executes in trusted CI. Audit the whole lockfile.
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Cache Playwright Chromium
        if: always()
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # 2026-11-05: on a cache hit launch the cached browser first; apt only when it cannot start.
      - name: Install Chromium for rendered guards
        if: always()
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            if node -e "require('playwright').chromium.launch().then((b) => b.close()).catch((e) => { console.error(e.message); process.exit(1); })"; then
              echo "cached Chromium launches: system dependencies already present, apt skipped"
            else
              npx playwright install-deps chromium
            fi
          else
            npx playwright install --with-deps chromium
          fi
      - name: Required rendered place-card standard
        if: always()
        run: node scripts/check-place-card-standard.mjs --require-browser
      - name: Upload place-card geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: place-card-standard-${{ github.sha }}
          path: artifacts/place-card-standard/
          if-no-files-found: error
          retention-days: 14
      - name: Required rendered map pin standard
        if: always()
        run: node scripts/test-map-pin-standard.mjs --require-browser

  build:
    name: guards-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Production build
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npx next build
      # postbuild (check-bundle) only runs on `npm run build`. #949 shipped green
      # here and died on Vercel; the ratchet must run after the build.
      - name: Homepage bundle ratchet
        run: node scripts/check-bundle.mjs

  # The ONE check branch protection requires. Green only when every shard, the
  # rendered/audit job and the build succeeded; a skipped or cancelled part is red.
  guards:
    name: guards
    if: always()
    needs: [shard, rendered, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the merge gate succeeded
        env:
          SHARD: ${{ needs.shard.result }}
          RENDERED: ${{ needs.rendered.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "shards=$SHARD rendered=$RENDERED build=$BUILD"
          test "$SHARD" = "success" && test "$RENDERED" = "success" && test "$BUILD" = "success"
