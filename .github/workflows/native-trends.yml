name: Native trends collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/trendSources/native*.js'
      - 'scripts/native-trends-collect.mjs'
      - '.github/workflows/native-trends.yml'
permissions:
  contents: read
concurrency:
  group: native-trends-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Collect private research with the production engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/native-trends-collect.mjs
