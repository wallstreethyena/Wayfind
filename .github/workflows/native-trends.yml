name: Native trends collection
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/trendSources/**'
      - 'lib/trendScore.js'
      - 'lib/trendTaxonomy.js'
      - 'app/api/cron/trend-signals/**'
      - 'app/api/cron/trend-maintenance/**'
      - 'scripts/native-trends*'
      - 'scripts/check-trend-sources.mjs'
      - '.github/workflows/native-trends.yml'
  push:
    branches: [main]
    paths:
      - 'lib/trendSources/native*.js'
      - 'scripts/native-trends-collect.mjs'
      - '.github/workflows/native-trends.yml'
permissions:
  contents: read
concurrency:
  group: native-trends-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Native and original source contracts without credentials
        run: |
          node scripts/check-trend-sources.mjs
          node scripts/check-trend-integrity.mjs
  registry-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1384 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/astra-native-trends-20260920'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate evidence only; never change branches or full-suite checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/lib/build-guard-registry.mjs
          git diff -- scripts/lib/guard-registry.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const content = readFileSync('scripts/lib/guard-registry.json', 'utf8');
          const bytes = Buffer.from(content);
          const expected = createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(15000),
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ content, encoding: 'utf-8' })
          });
          if (!response.ok) throw new Error(`registry-blob-http-${response.status}`);
          const result = await response.json();
          if (result.sha !== expected) throw new Error('registry-blob-hash-mismatch');
          console.log(`CANONICAL_REGISTRY_BLOB=${result.sha}`);
          console.log(`SOURCE_HEAD=${JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).pull_request.head.sha}`);
          NODE
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Collect private research and verify same-evidence reuse
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/native-trends-collect.mjs
