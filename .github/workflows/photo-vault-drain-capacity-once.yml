name: photo-vault-drain-capacity-once
on:
  push:
    branches:
      - fix/photo-vault-drain-capacity-2026-09-09
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/photo-vault-drain-capacity-2026-09-09
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repair drain capacity, red-lock starvation, regenerate registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="fix/photo-vault-drain-capacity-2026-09-09"
          SELF=".github/workflows/photo-vault-drain-capacity-once.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          python3 - <<'PY'
          from pathlib import Path

          # 1) Capacity: 25 decisions/hour = 600/day for the urgent at-risk
          # worklist, while preserving a separate once-daily general fill.
          p = Path("vercel.json")
          s = p.read_text()
          old = '''    {
                "path": "/api/cron/place-photos",
                "schedule": "50 4 * * *"
              }'''
          new = '''    {
                "path": "/api/cron/place-photos?source=at-risk&limit=25",
                "schedule": "50 * * * *"
              },
              {
                "path": "/api/cron/place-photos?source=all&limit=25",
                "schedule": "10 5 * * *"
              }'''
          if s.count(old) != 1:
              raise SystemExit(f"vercel.json place-photos cron shape drifted; expected exactly one old block, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))

          # 2) Starvation: wf_photo_at_risk intentionally keeps rejected rows.
          # Page past a decided prefix until we have `limit` actually-undecided
          # candidates or the reporting view is exhausted.
          p = Path("lib/placePhotoBackfill.js")
          s = p.read_text()
          old = '''async function fetchAtRiskWorklist(s, fetchLimit) {
            const r = await fetch(
              `${s.url}/rest/v1/${AT_RISK_VIEW}?select=place_id,name,category,earliest_expiry&order=earliest_expiry.asc&limit=${Math.max(1, fetchLimit)}`,
          '''
          new = '''async function fetchAtRiskWorklist(s, fetchLimit, offset = 0) {
            const r = await fetch(
              `${s.url}/rest/v1/${AT_RISK_VIEW}?select=place_id,name,category,earliest_expiry&order=earliest_expiry.asc&limit=${Math.max(1, fetchLimit)}&offset=${Math.max(0, offset)}`,
          '''
          if s.count(old) != 1:
              raise SystemExit(f"fetchAtRiskWorklist shape drifted; expected one match, found {s.count(old)}")
          s = s.replace(old, new, 1)

          needle = '''  return existing;
          }

          async function upsertPhotoRow(s, row) {'''
          helper = '''  return existing;
          }

          // wf_photo_at_risk is intentionally a REPORTING superset: rejected
          // places remain visible there because they are still at risk even after
          // this worker has decided Commons has no admissible substitute. That
          // means a single LIMIT page can eventually contain only already-decided
          // rows and starve every later place forever. Page through the ordered
          // view until we have enough UNDECIDED rows for this run. Fifty 1,000-row
          // pages covers more than the entire current Florida inventory while
          // keeping a hard bound on DB work if the view is ever corrupted.
          const MAX_AT_RISK_PAGES = 50;
          async function fetchUndecidedAtRiskWorklist(s, limit, pageSize) {
            const wanted = Math.max(1, Number(limit) || DEFAULT_LIMIT);
            const take = Math.max(1, Math.min(1000, Number(pageSize) || DEFAULT_SCAN_LIMIT));
            const rows = [];
            let offset = 0;

            for (let pageNo = 0; pageNo < MAX_AT_RISK_PAGES && rows.length < wanted; pageNo++) {
              const page = await fetchAtRiskWorklist(s, take, offset);
              if (!Array.isArray(page) || page.length === 0) break;
              offset += page.length;

              const existing = await fetchExistingPhotoIds(s, page.map((r) => r.place_id));
              for (const row of page) {
                if (existing.has(row.place_id)) continue;
                rows.push(row);
                if (rows.length >= wanted) break;
              }

              if (page.length < take) break;
            }
            return rows;
          }

          async function upsertPhotoRow(s, row) {'''
          if s.count(needle) != 1:
              raise SystemExit(f"fetchExistingPhotoIds insertion point drifted; found {s.count(needle)}")
          s = s.replace(needle, helper, 1)

          old_call = '      atRiskRows = await fetchAtRiskWorklist(s, scanLimit);'
          new_call = '      atRiskRows = await fetchUndecidedAtRiskWorklist(s, limit, scanLimit);'
          if s.count(old_call) != 1:
              raise SystemExit(f"at-risk call shape drifted; found {s.count(old_call)}")
          s = s.replace(old_call, new_call, 1)
          p.write_text(s)

          # 3) Extend the existing hermetic wiring guard. No new guard file:
          # the registry is still regenerated because assertion count changes.
          p = Path("scripts/test-photo-vault-wiring.mjs")
          s = p.read_text()

          old = '''    if (u.startsWith(SB.url + "/rest/v1/wf_photo_at_risk")) {
                ok(!u.includes("SELECT ") && !u.includes("select%20"), "PROBE: at-risk fetch is a PostgREST GET, never raw SQL text");
                return { ok: true, json: async () => atRisk };
              }'''
          new = '''    if (u.startsWith(SB.url + "/rest/v1/wf_photo_at_risk")) {
                ok(!u.includes("SELECT ") && !u.includes("select%20"), "PROBE: at-risk fetch is a PostgREST GET, never raw SQL text");
                const parsed = new URL(u);
                const limit = Math.max(1, Number(parsed.searchParams.get("limit")) || atRisk.length || 1);
                const offset = Math.max(0, Number(parsed.searchParams.get("offset")) || 0);
                atRiskFetches.push({ limit, offset });
                return { ok: true, json: async () => atRisk.slice(offset, offset + limit) };
              }'''
          if s.count(old) != 1:
              raise SystemExit(f"test makeDb at-risk handler drifted; found {s.count(old)}")
          s = s.replace(old, new, 1)

          old = '''  const table = new Map(existingRows.map((r) => [r.place_id, r]));
            const upsertCalls = [];
            const savedFetch = globalThis.fetch;'''
          new = '''  const table = new Map(existingRows.map((r) => [r.place_id, r]));
            const upsertCalls = [];
            const atRiskFetches = [];
            const savedFetch = globalThis.fetch;'''
          if s.count(old) != 1:
              raise SystemExit(f"test makeDb declarations drifted; found {s.count(old)}")
          s = s.replace(old, new, 1)

          old = '''  return {
              table,
              upsertCalls,
              restore() {'''
          new = '''  return {
              table,
              upsertCalls,
              atRiskFetches,
              restore() {'''
          if s.count(old) != 1:
              raise SystemExit(f"test makeDb return shape drifted; found {s.count(old)}")
          s = s.replace(old, new, 1)

          marker = '''  console.log("test-photo-vault-wiring: Section E OK — the at-risk worklist is fully drained before the general scan; source=at-risk|all each drive one worklist exclusively");'''
          inserted = '''  // E7 — HISTORICAL FAILURE CLASS: the reporting view intentionally keeps
            // rejected rows. Once the first 1,000 rows are all decided/rejected,
            // a one-page worker must NOT conclude there is no at-risk work. The
            // next undecided row lives beyond that prefix and must be reached by
            // an actual second PostgREST page.
            {
              const decided = Array.from({ length: 1000 }, (_, i) => ({
                place_id: `decided-${String(i).padStart(4, "0")}`,
                name: `Decided ${i}`,
                category: "food",
              }));
              const tail = Array.from({ length: 5 }, (_, i) => ({
                place_id: `tail-undecided-${i}`,
                name: `Tail ${i}`,
                category: "hotels",
              }));
              const db4 = makeDb({
                atRisk: [...decided, ...tail],
                existingRows: decided.map((r) => ({ place_id: r.place_id, status: "rejected" })),
              });
              const order4 = [];
              const result4 = await runBackfill({
                limit: 3,
                scanLimit: 1000,
                sbEnv: SB,
                source: "at-risk",
                resolvePhoto: async (p) => {
                  order4.push(p.place_id);
                  return null;
                },
                dryRun: true,
              });
              db4.restore();
              ok(db4.atRiskFetches.length >= 2, `E7: a fully-decided first 1,000-row page must force a second at-risk page, got ${db4.atRiskFetches.length} fetch(es)`);
              eq(db4.atRiskFetches[0] && db4.atRiskFetches[0].offset, 0, "E7: first at-risk page starts at offset 0");
              eq(db4.atRiskFetches[1] && db4.atRiskFetches[1].offset, 1000, "E7: second at-risk page advances to offset 1000");
              eq(JSON.stringify(order4), JSON.stringify(tail.slice(0, 3).map((r) => r.place_id)), "E7 (THE STARVATION LOCK): undecided rows beyond 1,000 decided/rejected rows are still processed");
              eq(result4.atRiskTaken, 3, "E7: the run spends all three requested decisions on the reachable tail rows");
            }

            console.log("test-photo-vault-wiring: Section E OK — the at-risk worklist is fully drained before the general scan and pagination prevents a decided/rejected prefix from starving later places; source=at-risk|all each drive one worklist exclusively");'''
          if s.count(marker) != 1:
              raise SystemExit(f"Section E marker drifted; found {s.count(marker)}")
          s = s.replace(marker, inserted, 1)

          final_marker = '''if (failures) {
            console.error(`test-photo-vault-wiring: FAIL — ${failures} assertion(s) failed`);'''
          schedule_section = '''// ─────────────────────────────────────────────────────────────────────────
          // SECTION G — the urgent vault worklist must have enough CLOCK CAPACITY
          // to beat the measured 2026-09-25 expiry cliff. The worker's safe
          // per-run default is 25; hourly therefore yields 600 decisions/day.
          // A separate daily source=all job preserves the low-pressure general
          // beach/attractions fill without stealing urgent capacity.
          // ─────────────────────────────────────────────────────────────────────────
          {
            const vercel = JSON.parse(readFileSync(new URL("../vercel.json", import.meta.url), "utf8"));
            const crons = Array.isArray(vercel.crons) ? vercel.crons : [];
            const urgent = crons.find((c) => String(c.path || "").startsWith("/api/cron/place-photos?") && String(c.path).includes("source=at-risk"));
            const general = crons.find((c) => String(c.path || "").startsWith("/api/cron/place-photos?") && String(c.path).includes("source=all"));
            ok(!!urgent, "G1: vercel.json must schedule a dedicated source=at-risk place-photo drain");
            eq(urgent && urgent.schedule, "50 * * * *", "G1 (THE CAPACITY LOCK): the urgent at-risk drain runs hourly, not once per day");
            const urgentUrl = new URL("https://wayfind.test" + ((urgent && urgent.path) || "/"));
            eq(urgentUrl.searchParams.get("limit"), "25", "G2: the hourly drain keeps the worker's tested 25-place per-run budget");
            eq(25 * 24, 600, "G2: the configured urgent cadence provides 600 decision slots/day (5,000 places ≈ 8.34 days before retries)");
            ok(!!general, "G3: a separate source=all general-fill schedule remains present");
            eq(general && general.schedule, "10 5 * * *", "G3: general fill remains once daily so it cannot steal the urgent hourly budget");
            console.log("test-photo-vault-wiring: Section G OK — urgent at-risk drain is hourly at 25/run (600/day) and general fill remains separately daily");
          }

          if (failures) {
            console.error(`test-photo-vault-wiring: FAIL — ${failures} assertion(s) failed`);'''
          if s.count(final_marker) != 1:
              raise SystemExit(f"final failure marker drifted; found {s.count(final_marker)}")
          s = s.replace(final_marker, schedule_section, 1)

          old_final = 'drains wf_photo_at_risk before the general scan, and app/api/cron/place-photos stays fail-closed and honest on an empty run'
          new_final = 'drains wf_photo_at_risk before the general scan without prefix starvation, keeps enough hourly capacity to beat the expiry cliff, and app/api/cron/place-photos stays fail-closed and honest on an empty run'
          if s.count(old_final) != 1:
              raise SystemExit(f"final summary marker drifted; found {s.count(old_final)}")
          s = s.replace(old_final, new_final, 1)
          p.write_text(s)
          PY

          # Mechanical registry truth — never hand-edit generated JSON.
          node scripts/lib/build-guard-registry.mjs

          # Targeted proof before the canonical full suite.
          node scripts/test-photo-vault-wiring.mjs
          node scripts/check-guard-registry.mjs
          git diff --check

          # This workflow is a one-shot repair tool, not product code.
          git rm "$SELF"
          git add -A
          git commit -m "fix(photos): make the permanent vault drain beat the expiry cliff"
          git push origin "HEAD:$BRANCH"

          # GITHUB_TOKEN pushes do not recursively create PR workflows. Explicitly
          # dispatch the canonical required guards workflow on the exact new head.
          printf '{"ref":"%s"}\n' "$BRANCH" > /tmp/dispatch.json
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/guards.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
