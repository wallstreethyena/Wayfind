name: reconcile wiki photo prefix on current main
on:
  push:
    branches:
      - fix/wiki-photo-prefix-event-scene-current-2026-09-10
permissions:
  contents: write
jobs:
  reconcile-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wiki-photo-prefix-event-scene-current-2026-09-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Apply already-proved lane diff onto current main
        shell: bash
        run: |
          git fetch origin fix/wiki-photo-prefix-event-scene-2026-09-10
          git diff 635732d64d91376e5df70baf4e8032d05ffdae5b 432915302a53eb33cee02139a2f76abb2a2717ab -- \
            app/components/screens/Events.js \
            lib/commonsPhotos.js \
            lib/eventImageDisclosure.js \
            lib/popularity.js \
            scripts/guards.txt \
            scripts/test-event-scene-disclosure.mjs \
            scripts/test-wiki-prefix-recovery.mjs > /tmp/lane.patch
          test -s /tmp/lane.patch
          git apply --3way /tmp/lane.patch
          node scripts/lib/build-guard-registry.mjs
          git diff --check
      - name: Focused behavior proof after reconciliation
        run: |
          node scripts/test-wiki-prefix-recovery.mjs
          node scripts/test-event-scene-disclosure.mjs
          node scripts/test-commons-photos.mjs
          node scripts/test-popularity.mjs
          node scripts/check-wikipedia-identity-verification.mjs
          node scripts/check-curated-events-surface.mjs
          node scripts/check-guard-registry.mjs
      - name: Full production build including all prebuild guards and bundle guard
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm run build
      - name: Remove temporary reconciliation workflow and keep registry exact
        run: |
          rm .github/workflows/reconcile-wiki-photo-prefix-current-2026-09-10.yml
          node scripts/lib/build-guard-registry.mjs
          node scripts/check-guard-registry.mjs
          git diff --check
          test ! -d scripts/__pycache__
      - name: Commit exact current-main result
        shell: bash
        run: |
          git config user.name 'codex (Wayfind problem solver)'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'fix(photos): recover safe Wikipedia prefix misses and label event scenes' -m 'Reconciled onto current main after #1245 and #1220. MediaWiki opensearch now shares one conservative candidate ladder across popularity and permanent Commons photos: raw name, existing qualifier strip, then one trailing generic place noun. The singular beach vocabulary bug is fixed. The broader rung requires place-type evidence in the returned title before the existing identity and free-license gates. Curated stock event scenes now visibly say Scene photo only when that stock image is actually rendered.'
          git push origin HEAD:fix/wiki-photo-prefix-event-scene-current-2026-09-10
