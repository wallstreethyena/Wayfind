name: export-current-main
on:
  pull_request:
    paths:
      - '.github/workflows/export-current-main.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package repository snapshot
        run: |
          tar --exclude=.git -czf /tmp/wayfind-repo.tgz .
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wayfind-repo-${{ github.sha }}
          path: /tmp/wayfind-repo.tgz
          if-no-files-found: error
          retention-days: 1
