name: map-stale-pr-conflicts
on:
  pull_request:
    paths:
      - '.github/workflows/export-current-main.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '1221'
            branch: fix/atlas-gate-skip-visibility-2026-09-09
          - pr: '1233'
            branch: lane/photo-vault/at-risk-read-retry-2026-09-09
          - pr: '1267'
            branch: fix/family-day-expanded-rails
          - pr: '1280'
            branch: fix/shared-photo-loading
          - pr: '1272'
            branch: cursor/bookable-near-me-empty-rail
          - pr: '1319'
            branch: cursor/fallbackimg-lifecycle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Map conflicts only
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          git config user.name 'Wayfind conflict mapper'
          git config user.email 'noreply@github.com'
          git fetch origin "$TARGET_BRANCH"
          git checkout -B candidate FETCH_HEAD
          set +e
          git rebase origin/main
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "PR #$PR_NUMBER: CLEAN_REBASE"
            exit 0
          fi
          echo "PR #$PR_NUMBER: CONFLICTS"
          git diff --name-only --diff-filter=U | sort
          git rebase --abort || true
          exit 0
