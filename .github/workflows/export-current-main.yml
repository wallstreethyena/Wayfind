name: map-remaining-open-pr-conflicts
on:
  pull_request:
    paths:
      - '.github/workflows/export-current-main.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '1142'
            branch: design/premium-event-prototype-20260906
          - pr: '1145'
            branch: feat/explainable-wayfind-score
          - pr: '1248'
            branch: fix/beach-build-deadlines-2026-09-10
          - pr: '1249'
            branch: feat/graceful-outage-state-2026-09-10
          - pr: '1250'
            branch: fix/verify-offers-token-managed-cron-2026-09-10
          - pr: '1263'
            branch: perf/all-poster-speed
          - pr: '1268'
            branch: feat/apple-map-all-categories
          - pr: '1272'
            branch: cursor/bookable-near-me-empty-rail
          - pr: '1274'
            branch: fix/event-creator-cover-recovery
          - pr: '1285'
            branch: fix/google-sku-cost-protection
          - pr: '1318'
            branch: cursor/card-36-media-proximity-e57e
          - pr: '1319'
            branch: cursor/fallback-img-lifecycle-96ed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Map conflicts only
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          git config user.name 'Wayfind conflict mapper'
          git config user.email 'noreply@github.com'
          git fetch origin "$TARGET_BRANCH"
          git checkout -B candidate FETCH_HEAD
          set +e
          git rebase origin/main
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "PR #$PR_NUMBER: CLEAN_REBASE"
            exit 0
          fi
          echo "PR #$PR_NUMBER: CONFLICTS"
          git diff --name-only --diff-filter=U | sort
          git rebase --abort || true
          exit 0
