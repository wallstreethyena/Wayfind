# .github/workflows/fall-discovery.yml — the FREE-FIRST seasonal offering
# discovery pipeline (scripts/fall-discovery/run.mjs), run on a clock.
#
# WHAT THIS IS NOT: it never writes to lib/fallPool.js, never opens a PR,
# never commits, and never touches Supabase beyond a READ of wf_inventory (the
# same read scripts/check-inventory-integrity.mjs already does in canary.yml,
# with the same secret names). It produces a dated report
# (docs/audits/fall-discovery/<date>.{json,md}) and uploads it as a workflow
# artifact for a human — or another automated pass — to read and decide from.
# CANDIDATES ONLY, exactly like the script's own header says.
#
# NO PAID API. Every fetch the pipeline makes is a bare `fetch()` against a
# public page (scripts/fall-discovery/lib/fetch.mjs's politeFetch) — nothing
# metered, no places.googleapis.com, no SerpAPI. The only credential this
# workflow needs at all is a Supabase key to READ wf_inventory, which is free.
#
# SEASON WINDOW: the pipeline is only useful while the fall skin itself is
# live — Aug 26 through Thanksgiving (lib/fallSkin.js) — so this runs weekly
# from Aug 20 (a week of runway before the season opens, to seed/refresh
# data/fall-discovery/official-sources.json before day one) through Nov 30.
# Cron alone cannot express "day 20 of August through day 30 of November", so
# the schedule fires weekly across months 8-11 and a guard step skips the run
# on any August Monday before the 20th. workflow_dispatch always runs, on
# purpose, so a manual re-run outside the window is never blocked by the date
# check that exists only to keep the SCHEDULED runs inside the useful window.
name: fall-discovery
on:
  schedule:
    - cron: "0 13 * 8-11 1"   # every Monday 13:00 UTC, Aug-Nov only
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fall-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: fall offering discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: Season-window check (scheduled runs only)
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — window check bypassed on purpose"
            exit 0
          fi
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          if [ "$MONTH" = "08" ] && [ "$DAY" -lt 20 ]; then
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "before Aug 20 — outside the discovery window, skipping the run"
          else
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          fi

      # NO PAID KEY. wf_inventory is anon-readable, so the anon/publishable
      # key works here exactly as it does for a manual command-line run
      # (scripts/fall-discovery/lib/env.mjs accepts either); the service-role
      # key is used because it is the same secret every other scheduled
      # workflow in this repo already reads (canary.yml, guards.yml), not
      # because this pipeline needs elevated access.
      - name: Run the discovery pipeline
        if: steps.window.outputs.in_window == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fall-discovery/run.mjs

      # Uploaded, never committed and never published anywhere — a human (or
      # another automated pass) reads this and decides what, if anything,
      # changes lib/fallPool.js. 30 days covers a full season's worth of
      # weekly runs for a look-back without accumulating indefinitely.
      - name: Upload discovery report
        if: steps.window.outputs.in_window == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fall-discovery-report-${{ github.run_id }}
          path: docs/audits/fall-discovery/
          retention-days: 30
          if-no-files-found: warn
