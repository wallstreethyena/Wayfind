name: lazy-supabase-final-reconcile-once
on:
  push:
    branches: [perf/lazy-home-supabase-2026-09-08]
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[lazy-supabase-final-reconciled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/lazy-home-supabase-2026-09-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Targeted regression proof
        run: |
          node scripts/check-home-eager-supabase.mjs
          node scripts/check-trend-integrity.mjs
          node scripts/test-city-gate.mjs
          node scripts/test-coverage-waitlist.mjs
          node scripts/test-guide-event-ticket-cta.mjs
          node scripts/test-popularity.mjs
      - name: Remove one-shot scaffolding
        run: rm .github/workflows/lazy-supabase-final-reconcile-once.yml
      - name: Regenerate exact-tree guard registry
        run: node scripts/lib/build-guard-registry.mjs
      - name: Verify final tree
        run: |
          node scripts/check-guard-registry.mjs
          git diff --check
      - name: Commit reconciled final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: reconcile lazy Supabase boundary onto latest main [lazy-supabase-final-reconciled]"
          git push --force-with-lease origin HEAD:perf/lazy-home-supabase-2026-09-08
