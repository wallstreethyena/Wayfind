# The required `guards` check on a pull request can be green and the push to
# main can still be cancelled (timeout or a newer push). That is what happened
# on 2026-11-03: PR runs for #2155, #2156, and #2157 succeeded, and the main
# pushes were cancelled at timeout-minutes. Nothing paged.
#
# This workflow asks one question of the Actions API: the newest completed
# guards run for a push to main must have conclusion success. cancelled,
# failure, skipped, timed_out, and a run that is still going after 45 minutes
# fail this job. It does not merge, deploy, or write to the database.
name: guards-main-monitor
on:
  schedule:
    # Hourly, off the top of the hour so it is not in the same stampede as
    # the */30 canary. GitHub may delay scheduled runs; a miss here is visible
    # as the absence of this workflow, and the next run still judges the
    # latest completed main guards run.
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: guards-main-monitor
  cancel-in-progress: false
jobs:
  latest-main-guards:
    name: latest main guards run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Latest completed main guards run must be success
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/guards-main-run.mjs
