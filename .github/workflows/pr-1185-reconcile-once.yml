name: pr-1185-reconcile-once
on:
  push:
    branches:
      - perf/lazy-home-supabase-2026-09-08
permissions:
  contents: write
  actions: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/lazy-home-supabase-2026-09-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main, resolve only the audited overlap, and dispatch guards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="perf/lazy-home-supabase-2026-09-08"
          SELF=".github/workflows/pr-1185-reconcile-once.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          PR_HEAD="$(git rev-parse HEAD)"
          MERGE_BASE="$(git merge-base "$PR_HEAD" origin/main)"
          echo "PR head: $PR_HEAD"
          echo "main: $(git rev-parse origin/main)"
          echo "merge base: $MERGE_BASE"

          # The recovery trigger must already be on the default branch. This is
          # what lets the bot explicitly start the real required guard job after
          # its own push (normal GITHUB_TOKEN push recursion is intentionally suppressed).
          git show origin/main:.github/workflows/guards.yml | grep -q "workflow_dispatch"

          set +e
          git merge --no-ff --no-commit origin/main
          MERGE_RC=$?
          set -e

          if [ "$MERGE_RC" -ne 0 ]; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            printf '%s\n' "$CONFLICTS"
            UNEXPECTED=""
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                app/home.js|scripts/guards.txt|scripts/lib/guard-registry.json|.github/workflows/guards.yml) ;;
                *) UNEXPECTED="${UNEXPECTED}${file}\n" ;;
              esac
            done <<< "$CONFLICTS"
            if [ -n "$UNEXPECTED" ]; then
              echo "Unexpected conflict(s); refusing to guess:"
              printf '%b' "$UNEXPECTED"
              exit 1
            fi

            if grep -qx "app/home.js" <<< "$CONFLICTS"; then
              # When this lane was audited, main's only home.js edit since the
              # merge base was the release BUILD_ID. Refuse to discard any newer
              # main-side homepage work if that assumption has stopped being true.
              BAD_HOME="$(git diff "$MERGE_BASE" origin/main -- app/home.js | grep -E '^[+-][^+-]' | grep -Ev '^[+-]const BUILD_ID = "v[^"]+";$' || true)"
              if [ -n "$BAD_HOME" ]; then
                echo "main has additional home.js edits beyond BUILD_ID; refusing an ours-wins resolution:"
                printf '%s\n' "$BAD_HOME"
                exit 1
              fi
              git checkout --ours app/home.js
              git add app/home.js
            fi

            if grep -qx "scripts/guards.txt" <<< "$CONFLICTS"; then
              # Main owns the accumulated guard list; #1185 contributes one new
              # guard and nothing else to this file.
              git checkout --theirs scripts/guards.txt
              git add scripts/guards.txt
            fi

            if grep -qx "scripts/lib/guard-registry.json" <<< "$CONFLICTS"; then
              # Generated file: start from main, then regenerate from the merged
              # checkout below. Never hand-merge registry counts.
              git checkout --theirs scripts/lib/guard-registry.json
              git add scripts/lib/guard-registry.json
            fi

            if grep -qx ".github/workflows/guards.yml" <<< "$CONFLICTS"; then
              # #1204 is the canonical recovery trigger now on main.
              git checkout --theirs .github/workflows/guards.yml
              git add .github/workflows/guards.yml
            fi
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # Preserve current release identity even if home.js needed an ours-side
          # conflict resolution.
          MAIN_BUILD_ID="$(git show origin/main:app/home.js | sed -n 's/^const BUILD_ID = "\(v[^"]*\)";$/\1/p' | head -1)"
          test -n "$MAIN_BUILD_ID"
          export MAIN_BUILD_ID
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("app/home.js")
          s = p.read_text()
          s, n = re.subn(r'^const BUILD_ID = "v[^"]+";$', f'const BUILD_ID = "{os.environ["MAIN_BUILD_ID"]}";', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit(f"expected exactly one BUILD_ID replacement, got {n}")
          p.write_text(s)
          PY

          # Keep every current-main guard and add #1185's property guard once.
          if ! grep -qx 'node scripts/check-home-eager-supabase.mjs' scripts/guards.txt; then
            printf '\n# 2026-09-08 — Supabase must never re-enter the homepage eager static graph, and transient lazy-load failure must be retryable.\nnode scripts/check-home-eager-supabase.mjs\n' >> scripts/guards.txt
          fi

          # Registry is generated truth, so rebuild it from the fully reconciled tree.
          node scripts/lib/build-guard-registry.mjs
          node scripts/check-home-eager-supabase.mjs
          node scripts/check-guard-manifest.mjs
          git diff --check

          # This workflow is a one-shot repair tool, not product code.
          git rm "$SELF"
          git add -A
          git commit -m "Merge main into #1185 after guard recovery"
          git push origin "HEAD:$BRANCH"

          # Explicit workflow_dispatch is intentionally exempt from GITHUB_TOKEN's
          # anti-recursion rule. It runs the canonical `guards` workflow on the
          # exact resolved branch head we just pushed.
          printf '{"ref":"%s"}\n' "$BRANCH" > /tmp/dispatch.json
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/guards.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
