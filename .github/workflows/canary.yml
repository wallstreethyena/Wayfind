# .github/workflows/canary.yml — WHAT THE USER SEES, CHECKED ON A CLOCK.
#
# Owner, 2026-08-20: "how can we find these issues? ... i need this website to have
# zero bug ... implement a reasoning to prevent them from ever happening again and
# guardrails i need crons everywhere".
#
# THE MEASUREMENT THAT MADE THIS FILE. On 2026-08-20 the owner hit three severe
# bugs in a row — Like navigated instead of liking, /p/<id> rendered a homepage
# with no rails, and the in-app Home tab could not get back to a populated page.
# The guard suite was 382/382 GREEN through all of it. Why:
#
#     420 guard scripts
#     343  read source code as TEXT
#       5  actually render the app
#       2  of those gate a deploy
#
# A regex cannot see a render. Every bug that day was a render fact. guards.yml is
# excellent at "the code says X" and structurally blind to "the user sees Y".
#
# This workflow is the missing layer, and it runs on a clock rather than on a push,
# because the two failure modes it catches do not arrive with a commit:
#   - an ISR regeneration that comes back with no rail data
#   - an INGEST that writes untyped or duplicated rows into Supabase
# Neither is a code change. Neither would ever trip a pre-merge check.
name: canary
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  incident-delivery:
    name: production incident delivery
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Independent of the email/Sentry credentials used by the watcher.
      # A failed or missing heartbeat must produce a visible red canary.
      - name: Latest job-watch outcome and freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-job-watch-delivery.mjs
  routes:
    name: production route contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # No build, no server: E2E_BASE_URL points the same spec at the deployed
      # site, so this asserts what is LIVE rather than what would be built.
      - name: Shell route contract against production
        env:
          E2E_BASE_URL: https://www.gowayfind.com
        run: npx playwright test tests/e2e/shell-route-contract.spec.js

  inventory:
    name: production data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # Missing credentials fail the job before the optional local-script skip.
      - name: Require inventory credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Database canary requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. Check not performed."
            exit 1
          fi
      - name: Inventory integrity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-inventory-integrity.mjs

  promote-metros:
    name: promotion metro live parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # Catches the 2026-09-01 defect class: a metro added straight to
      # wf_promote_metros with no matching migration, silently un-mirrored by
      # lib/promoteIndex.js PROMOTE_METROS. Missing secrets fail this job.
      - name: Require metro-check credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Database canary requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. Check not performed."
            exit 1
          fi
      - name: Promote-metros live drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-promote-metros-live-drift.mjs

  photos:
    name: photo protection — placeholder rate + repair queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # 2026-09-08: the `photos` ledger exhausted 950/950 on 2026-09-01 and
      # nothing measured what a reader actually saw — 15,088 active refs had
      # no cache row. Missing credentials fail this job, exactly like the
      # other database canaries above; a probe run cannot take a Google
      # grant either way (x-wayfind-photo-probe: 1), so this never risks the
      # exhausted ledger.
      - name: Require photo-monitor credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Photo monitor requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. Check not performed."
            exit 1
          fi
      - name: Photo placeholder sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/photo-monitor.mjs --base-url=https://www.gowayfind.com --json

  deploy-contract:
    name: RPC + migration contract vs production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # 2026-09-07: #1153 shipped a 5-arg RPC caller against a still-3-arg
      # production function (its migration was reviewed, merged, and never
      # applied) — the 08:23 UTC popularity cron did zero work across all four
      # providers. Repo-only guards could not see that production drift.
      - name: Require deploy-contract credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Database canary requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. Check not performed."
            exit 1
          fi
      - name: RPC schema contract (call sites vs production pg_proc)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-rpc-schema-contract.mjs
      - name: Migration reconciliation (repo files vs applied ledger)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-migration-reconciliation.mjs
