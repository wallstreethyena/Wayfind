name: Prepare owner search-help removal
on:
  pull_request:
    paths: ['.github/workflows/remove-search-help-prep.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/remove-home-search-help-20260920'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Apply exact owner-directed removal and protect search controls
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const path = 'app/home.js';
          const original = readFileSync(path, 'utf8');
          const marker = 'id="wf-search-help"';
          const lines = original.split('\n');
          const matching = lines.filter(line => line.includes(marker));
          assert.equal(matching.length, 1, 'one helper paragraph expected');
          assert(matching[0].includes('Search places, cities, or street addresses in Wayfind.'));
          assert(matching[0].trim().endsWith('</div>}'));
          const description = ' aria-describedby="wf-search-help"';
          assert.equal(original.split(description).length - 1, 1);
          const changed = lines.filter(line => !line.includes(marker)).join('\n').replace(description, '');
          assert.equal(changed.includes('wf-search-help'), false);
          writeFileSync(path, changed);
          const testPath = 'scripts/test-search-experience.mjs';
          const test = readFileSync(testPath, 'utf8');
          assert(!test.includes('Owner-directed homepage search-copy removal'));
          writeFileSync(testPath, test + `
          // Owner-directed homepage search-copy removal, 2026-09-20.
          // Keep the real search controls and live feedback; no replacement paragraph.
          const { readFileSync } = await import("node:fs");
          const homeSource = readFileSync(new URL("../app/home.js", import.meta.url), "utf8");
          assert.doesNotMatch(homeSource, /wf-search-help/, "the rejected search helper and its dangling aria reference stay removed");
          assert.doesNotMatch(homeSource, /Search places, cities, or street addresses in Wayfind/, "the rejected paragraph must not return under another class");
          assert.match(homeSource, /aria-label="Search a place or city" placeholder="Search a place or city"/);
          assert.match(homeSource, /className="wf-search-submit"/);
          assert.match(homeSource, /aria-label="Clear search"/);
          assert.match(homeSource, /id="wf-suggestions" role="listbox"/);
          assert.match(homeSource, /searchFeedback && !searchBusy/);
          console.log("test-search-experience: owner search-copy removal and retained controls OK");
          `);
          const run = () => spawnSync(process.execPath, [testPath], { encoding: 'utf8' });
          const green = run();
          process.stdout.write(green.stdout); process.stderr.write(green.stderr);
          assert.equal(green.status, 0);
          try {
            writeFileSync(path, original);
            const red = run();
            assert.notEqual(red.status, 0, 'restoring the rejected paragraph must fail');
            assert(red.stderr.includes('rejected search helper'), 'mutation failed for the expected reason');
            console.log('RED PROOF: original helper rejected by the new regression check');
          } finally { writeFileSync(path, changed); }
          assert.equal(run().status, 0);
          NODE
          node scripts/lib/build-guard-registry.mjs
          node scripts/check-guard-registry.mjs
          node scripts/test-city-search.mjs
          node scripts/test-home-first-paint.mjs
          npm run check:jsx
          git diff --check
          git diff --stat
          git diff -- app/home.js scripts/test-search-experience.mjs
      - name: Publish verified content-addressed blobs, never update branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const path of ['app/home.js', 'scripts/test-search-experience.mjs', 'scripts/lib/guard-registry.json']) {
            const content = readFileSync(path, 'utf8'), bytes = Buffer.from(content);
            const expected = createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github+json' },
              body: JSON.stringify({content, encoding: 'utf-8'})
            });
            if (!response.ok) throw new Error(`blob-http-${response.status}`);
            const result = await response.json();
            if (result.sha !== expected) throw new Error('blob-content-mismatch');
            console.log(`VERIFIED_BLOB ${path} ${result.sha}`);
          }
          NODE
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify actual homepage at phone, tablet and desktop widths
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: e2e-placeholder-not-a-real-key
          NEXT_PUBLIC_SUPABASE_URL: https://e2eplaceholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-anon-key-not-real
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/search-help-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync } from 'node:fs';
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({headless:true});
          mkdirSync('search-help-evidence', {recursive:true});
          try {
            for (const width of [390, 768, 1440]) {
              const page = await browser.newPage({ viewport: {width, height:900} });
              // Only local fixture rendering: never hit external providers or spend.
              await page.route('**/*', async route => {
                const u = new URL(route.request().url());
                if (u.hostname !== '127.0.0.1') return route.abort();
                if (u.pathname.startsWith('/api/')) return route.fulfill({status:503,contentType:'application/json',body:'{"error":"local-render-only"}'});
                return route.continue();
              });
              for (let i=0;i<30;i++) {
                try { await page.goto('http://127.0.0.1:3000/', {waitUntil:'domcontentloaded',timeout:60000}); break; }
                catch(e) { if(i===29) throw e; await new Promise(r=>setTimeout(r,1000)); }
              }
              const input = page.getByRole('combobox', {name:'Search a place or city'});
              await input.waitFor({state:'visible',timeout:60000});
              assert.equal(await page.locator('#wf-search-help').count(),0);
              assert.equal(await page.getByText('Search places, cities, or street addresses in Wayfind.',{exact:false}).count(),0);
              assert.equal(await input.getAttribute('aria-describedby'),null);
              assert(await page.locator('.wf-search-submit').isVisible());
              await input.fill('Orl');
              assert(await page.getByRole('button',{name:'Clear search',exact:true}).isVisible());
              await page.getByRole('button',{name:'Clear search',exact:true}).click();
              assert.equal(await input.inputValue(),'');
              await page.screenshot({path:`search-help-evidence/home-${width}.png`});
              console.log(`RENDER VERIFIED ${width}: helper absent, input/button visible, clear works`);
              await page.close();
            }
          } finally { await browser.close(); }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-help-evidence
          path: |
            search-help-evidence/
            /tmp/search-help-next.log
