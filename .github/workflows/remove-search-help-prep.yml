name: Verify owner search-help removal
on:
  pull_request:
    paths: ['.github/workflows/remove-search-help-prep.yml']
permissions:
  contents: read
jobs:
  verify-search:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/remove-home-search-help-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Source checks
        run: |
          node scripts/test-search-experience.mjs
          node scripts/test-city-search.mjs
          node scripts/check-guard-registry.mjs
          npm run check:jsx
          git diff --exit-code
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Render actual homepage and exercise retained controls
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: e2e-placeholder-not-a-real-key
          NEXT_PUBLIC_SUPABASE_URL: https://e2eplaceholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-anon-key-not-real
        run: |
          mkdir -p search-help-evidence
          npm run dev -- --hostname 127.0.0.1 > search-help-evidence/next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { chromium, expect } from '@playwright/test';
          const browser = await chromium.launch({headless:true});
          try {
            for (const width of [390,768,1440]) {
              const page = await browser.newPage({viewport:{width,height:900}});
              const errors=[];
              page.on('pageerror', e=>errors.push(e.message));
              await page.route('**/*', async route => {
                const u=new URL(route.request().url());
                if(u.hostname!=='127.0.0.1') return route.abort();
                if(u.pathname.startsWith('/api/')) return route.fulfill({status:503,contentType:'application/json',body:'{"error":"local-render-only"}'});
                return route.continue();
              });
              try {
                for(let i=0;i<20;i++) {
                  try { await page.goto('http://127.0.0.1:3000/',{waitUntil:'domcontentloaded',timeout:60000}); break; }
                  catch(e) { if(i===19) throw e; await new Promise(r=>setTimeout(r,1000)); }
                }
                const input=page.getByRole('combobox',{name:'Search a place or city'});
                await expect(input).toBeVisible({timeout:60000});
                // Visibility alone can precede hydration. Wait for the actual
                // React input handler before exercising a controlled input.
                await page.waitForFunction(()=>{
                  const el=document.querySelector('.wf-search-input');
                  return el && Object.keys(el).some(k=>k.startsWith('__reactProps$') && typeof el[k]?.onChange==='function');
                },null,{timeout:30000});
                assert.equal(await page.evaluate(()=>innerWidth),width);
                await expect(page.locator('#wf-search-help')).toHaveCount(0);
                await expect(page.getByText('Search places, cities, or street addresses in Wayfind.',{exact:false})).toHaveCount(0);
                assert.equal(await input.getAttribute('aria-describedby'),null);
                await expect(page.locator('.wf-search-submit')).toBeVisible();
                await input.fill('Orl');
                const clear=page.getByRole('button',{name:'Clear search',exact:true});
                await expect(clear).toBeVisible({timeout:10000});
                await clear.click();
                await expect(input).toHaveValue('');
                console.log(`RENDER VERIFIED ${width}: helper absent, retained search visible, clear works`);
              } finally {
                await page.screenshot({path:`search-help-evidence/home-${width}.png`});
                writeFileSync(`search-help-evidence/home-${width}.html`,await page.content());
                writeFileSync(`search-help-evidence/errors-${width}.json`,JSON.stringify(errors));
                await page.close();
              }
            }
          } finally { await browser.close(); }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-help-evidence
          path: search-help-evidence/
