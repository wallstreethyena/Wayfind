# .github/workflows/synthetic-monitor.yml — PRODUCTION-LIKE SYNTHETIC USER
# MONITORING, installed at its real path, running on a real schedule.
#
# DO NOT PARK THIS FILE ELSEWHERE. ops/canary.workflow.yml sat unreachable at
# a non-workflow path for an unknown stretch because the pushing token lacked
# the `workflow` OAuth scope — .github/workflows/canary.yml never existed,
# and three real guards (production route contract, inventory integrity,
# promote-metros live drift) never ran once while everyone believed they
# were scheduled. scripts/check-synthetic-monitor-hermetic.mjs asserts THIS
# file exists at exactly this path, with a real cron schedule, so that
# specific failure mode cannot repeat silently for this workflow.
#
# This is a SMOKE TEST, not a guard-suite member: it touches the live network
# and a flaky partner/CDN must never be able to block a merge (see
# scripts/check-guard-hermeticity.mjs's rationale for keeping the two
# separate). scripts/run-synthetic-monitor.mjs is deliberately absent from
# scripts/guards.txt for the same reason.
name: synthetic-monitor
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, UTC
  workflow_dispatch:
    inputs:
      scenario:
        description: "Run one scenario id instead of --all (optional)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: synthetic-monitor
  cancel-in-progress: true
jobs:
  monitor:
    name: synthetic user monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run synthetic monitor against production
        id: run
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ -n "$SCENARIO" ]; then
            node scripts/run-synthetic-monitor.mjs --scenario="$SCENARIO" --base-url=https://www.gowayfind.com
          else
            node scripts/run-synthetic-monitor.mjs --all --base-url=https://www.gowayfind.com
          fi
      # Runs even when the step above fails — the evidence IS the point of a
      # failing run. Kept for 14 days: long enough to catch a Monday-morning
      # look at a Friday-night failure, short enough not to accumulate PII-free
      # but still site-specific screenshots forever.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: synthetic-evidence/
          retention-days: 14
          if-no-files-found: ignore
      # HEARTBEAT. 2026-09-09: this workflow failed on every scheduled run from
      # 2026-09-08 18:25Z and nothing said so, because a workflow that fails
      # inside GitHub writes no wf_job_pulse row and job-watch can only alert on
      # rows that exist. It also runs far less often than its own cron claims
      # (8 runs in 27 hours against a declared */30), so its silence needs to be
      # detectable too. `always()` so a FAILED run still leaves a beat — a
      # heartbeat that only fires on success is not a heartbeat.
      - name: Heartbeat
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/record-workflow-pulse.mjs --job=synthetic-monitor --outcome=${{ steps.run.outcome }}
