name: Python audit tools
on:
  pull_request:
    paths: ['tools/python/**', '.github/workflows/python-audit.yml']
  push:
    branches: [main]
    paths: ['tools/python/**', '.github/workflows/python-audit.yml']
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * *'
permissions:
  contents: read
concurrency:
  group: python-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: uv run --locked wayfind-audit report --input examples/snapshot.json --out reports/demo
  live-report:
    # Scheduled production reads require explicit activation. Missing configuration
    # on a manual run fails loudly; skipped scheduled jobs are not healthy audits.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.WAYFIND_PYTHON_AUDIT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --no-dev --extra live
      - name: Collect complete read-only snapshot
        env:
          WAYFIND_AUDIT_DATABASE_URL: ${{ secrets.WAYFIND_AUDIT_DATABASE_URL }}
        run: uv run --locked --no-dev wayfind-audit collect --out private/snapshot.json
      - name: Analyze snapshot
        run: uv run --locked --no-dev wayfind-audit report --input private/snapshot.json --out reports/live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wayfind-python-audit-${{ github.run_id }}
          path: tools/python/reports/live/
          if-no-files-found: error
          retention-days: 7
      - name: Remove raw snapshot
        if: always()
        run: python -c "from pathlib import Path; Path('private/snapshot.json').unlink(missing_ok=True); Path('private/revenue.json').unlink(missing_ok=True)"
  revenue-report:
    # Owner-authorized daily money check; reuse existing canary secrets.
    # Run independently so missing general-audit DSN never blocks commerce.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --no-dev
      - name: Collect complete revenue census without partner requests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run --locked --no-dev wayfind-audit revenue-collect --transport rest --out private/revenue.json
      - run: uv run --locked --no-dev wayfind-audit revenue-report --input private/revenue.json --out reports/revenue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wayfind-revenue-${{ github.run_id }}
          path: tools/python/reports/revenue/
          if-no-files-found: error
          retention-days: 14
      - name: Remove raw inventory
        if: always()
        run: python -c "from pathlib import Path; Path('private/revenue.json').unlink(missing_ok=True)"
