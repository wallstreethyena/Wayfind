name: Finalize Orlando registry once

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/fall-events-orlando-2026-guide' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove this one-shot before registry generation
        run: rm .github/workflows/finalize-orlando-registry-once.yml
      - name: Regenerate registry against the final tree
        run: |
          node scripts/lib/build-guard-registry.mjs
          node scripts/check-guard-registry.mjs
      - name: Commit final tree and registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/finalize-orlando-registry-once.yml scripts/lib/guard-registry.json
          git diff --cached --check
          git commit -m "test(guides): finalize guard registry on clean tree"
          git push origin HEAD:${{ github.head_ref }}
