name: Regenerate guide registry once

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'feat/fall-events-orlando-2026-guide' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/lib/build-guard-registry.mjs
      - run: node scripts/check-guard-registry.mjs
      - name: Commit regenerated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/guard-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(guides): regenerate guard registry after patch staging cleanup"
          git push origin HEAD:${{ github.head_ref }}
