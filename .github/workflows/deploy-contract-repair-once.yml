name: deploy-contract-repair-once
on:
  push:
    branches:
      - fix/deploy-contract-ledger-reconcile-2026-09-10
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove recovered migration bytes match production ledger
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const expected = new Map([
            ['supabase/migrations/20260909181112_wf_photo_coverage_census_hash_join_fix.sql', { bytes: 3205, md5: '7242c341fa0c14ead62fa7bee8965046' }],
            ['supabase/migrations/20260909184548_wf_heartbeat_watch.sql', { bytes: 9332, md5: '9db8c18de9d8948e2c05b39e416fe395' }],
            ['supabase/migrations/20260909144500_wf_verified_offers.sql', { bytes: 4716, md5: '08d8985d06f7de33a8cc7c9ddd61e92e' }],
          ]);
          for (const [file, want] of expected) {
            const b = fs.readFileSync(file);
            const got = crypto.createHash('md5').update(b).digest('hex');
            if (b.length !== want.bytes || got !== want.md5) {
              throw new Error(`${file}: recovered bytes do not match production ledger evidence: bytes=${b.length}/${want.bytes} md5=${got}/${want.md5}`);
            }
            console.log(`${file}: byte proof OK (${b.length} bytes, md5 ${got})`);
          }
          NODE
      - name: Remove one-shot workflow before registry generation
        run: rm .github/workflows/deploy-contract-repair-once.yml
      - name: Regenerate guard registry from final tree
        run: node scripts/lib/build-guard-registry.mjs
      - name: Reverse reconciliation red-proofs
        run: node scripts/check-reverse-migration-reconciliation.mjs
      - name: Require live deploy-contract credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Live migration reconciliation was not executed because Supabase canary credentials are missing."
            exit 1
          fi
      - name: Live migration reconciliation against production
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-migration-reconciliation.mjs
      - name: Guard manifest and whitespace
        run: |
          node scripts/check-guard-manifest.mjs
          git diff --check
      - name: Commit final reconciled tree
        run: |
          git config user.name "wayfind-deploy-contract-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::error::Expected registry/workflow finalization changes were absent"; exit 1; }
          git commit -m "test: finalize deploy-contract reconciliation proof"
          git push origin HEAD:fix/deploy-contract-ledger-reconcile-2026-09-10
