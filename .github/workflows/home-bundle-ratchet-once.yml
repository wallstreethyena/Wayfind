name: home-bundle-ratchet-once
on:
  push:
    branches: [perf/lazy-home-supabase-2026-09-08]
permissions:
  contents: write
jobs:
  ratchet:
    if: ${{ !contains(github.event.head_commit.message, '[home-bundle-ratcheted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/lazy-home-supabase-2026-09-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply measured bundle ratchet
        run: node scripts/ratchet-home-bundle-once.mjs
      - name: Prove the ratchet contract
        run: |
          node scripts/test-sentry-lazy.mjs
          node scripts/check-home-eager-supabase.mjs
          git diff --check
      - name: Remove one-shot scaffolding
        run: |
          rm scripts/ratchet-home-bundle-once.mjs
          rm .github/workflows/home-bundle-ratchet-once.yml
      - name: Commit exact ratcheted tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: ratchet homepage bundle ceiling to 445KB [home-bundle-ratcheted]"
          git push --force-with-lease origin HEAD:perf/lazy-home-supabase-2026-09-08
