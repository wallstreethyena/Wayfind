[project]
name = "wayfind-audit"
version = "0.1.0"
description = "Read-only Wayfind coverage, usage and duplicate analysis"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb>=1.4,<2"]

[project.optional-dependencies]
live = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
wayfind-audit = "wayfind_audit.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wayfind_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
